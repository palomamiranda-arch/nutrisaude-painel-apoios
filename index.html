<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Avaliação por Apoio — NutriSaúde</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f0;color:#1a1a1a;min-height:100vh}
.header{background:linear-gradient(135deg,#1b5e20,#43a047);color:#fff;padding:20px 24px 16px}
.header h1{font-size:1.4em;font-weight:700}
.header p{font-size:.82em;opacity:.85;margin-top:3px}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;padding:0 20px}
.tab{padding:11px 20px;cursor:pointer;font-size:.88em;font-weight:500;color:#555;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active,.tab:hover{color:#2e7d32;border-bottom-color:#43a047}
.content{padding:20px;max-width:1100px;margin:0 auto}
#loading{text-align:center;padding:60px 20px;color:#666}
.spinner{width:36px;height:36px;border:3px solid #e8f5e9;border-top-color:#43a047;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.08);border-top:4px solid #43a047;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.13)}
.card.yellow{border-top-color:#ffa000}
.card.red{border-top-color:#e53935}
.card-name{font-size:.92em;font-weight:600;color:#333;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:2.4em;font-weight:700;color:#2e7d32;line-height:1}
.card.yellow .score{color:#e65100}
.card.red .score{color:#c62828}
.score span{font-size:.35em;color:#888;font-weight:400}
.meta{font-size:.78em;color:#777;margin-top:4px}
.bar-wrap{background:#f5f5f5;border-radius:4px;height:6px;margin-top:10px}
.bar-fill{height:6px;border-radius:4px;background:#43a047}
.card.yellow .bar-fill{background:#ffa000}
.card.red .bar-fill{background:#e53935}
.chart-box{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:24px}
.chart-box h3{font-size:.95em;color:#2e7d32;margin-bottom:14px}
.chart-h{height:240px;position:relative}
.comment-card{background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid #66bb6a}
.comment-card.bad{border-left-color:#ef9a9a}
.cm{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cm-apoio{font-weight:600;color:#1b5e20;font-size:.88em}
.cm-unit{color:#777;font-size:.83em}
.cm-date{color:#aaa;font-size:.8em}
.cm-nota{background:#43a047;color:#fff;border-radius:10px;padding:1px 9px;font-size:.8em;font-weight:600}
.cm-nota.mid{background:#ffa000}
.cm-nota.bad{background:#e53935}
.cm-text{font-size:.85em;color:#444;line-height:1.5}
.cm-label{font-size:.75em;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-top:8px}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters select{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:.85em;color:#333;background:#fff}
.nodata{text-align:center;color:#aaa;padding:30px;font-size:.9em}
#sec-rank,#sec-comments{display:none}
.err{background:#fff3f3;border:1px solid #ffcdd2;border-radius:8px;padding:16px;color:#c62828;font-size:.9em}
</style>
</head>
<body>
<div class="header">
  <h1>Painel de Avaliação por Apoio</h1>
  <p id="sub">NutriSaúde · Carregando...</p>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('rank',this)">Ranking</div>
  <div class="tab" onclick="switchTab('comments',this)">Comentários</div>
</div>
<div class="content">
  <div id="loading"><div class="spinner"></div>Buscando avaliações...</div>
  <div id="sec-rank">
    <div class="cards" id="cards"></div>
    <div class="chart-box"><h3>Nota Média por Apoio</h3><div class="chart-h"><canvas id="chart"></canvas></div></div>
  </div>
  <div id="sec-comments">
    <div class="filters">
      <select id="fa" onchange="renderComments()"><option value="">Todos os apoios</option></select>
      <select id="fu" onchange="renderComments()"><option value="">Todas as unidades</option></select>
    </div>
    <div id="comments-list"></div>
  </div>
</div>

<script>
const SHEET_ID = '1PafyffakYHc0BTmmu-RPM4nYtNr6MzkJ4iEJ5Eg3KIU';
let all = [], barChart;

function switchTab(t, el) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sec-rank').style.display = t === 'rank' ? 'block' : 'none';
  document.getElementById('sec-comments').style.display = t === 'comments' ? 'block' : 'none';
}

function cls(m) { return m >= 8 ? '' : m >= 6 ? 'yellow' : 'red'; }
function ncls(n) { return n >= 8 ? '' : n >= 6 ? 'mid' : 'bad'; }
function fmtDate(v) {
  if (!v) return '';
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleDateString('pt-BR');
}

async function fetchSheet(sheetName) {
  const enc = encodeURIComponent(sheetName);
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${enc}&tqx=out:json`;
  const resp = await fetch(url);
  const text = await resp.text();
  const json = JSON.parse(text.replace(/^[^{]*/, '').replace(/[^}]*$/, ''));
  const cols = json.table.cols.map(c => c.label);
  return json.table.rows.map(r => {
    const row = {};
    r.c.forEach((cell, i) => { row[cols[i]] = cell ? (cell.f || cell.v) : ''; });
    return row;
  });
}

function aggregate(rows) {
  const map = {};
  for (const r of rows) {
    const name = r['Apoio'] || '';
    if (!name) continue;
    if (!map[name]) map[name] = { nome: name, notas: [], rows: [] };
    map[name].notas.push(parseFloat(r['Nota']) || 0);
    map[name].rows.push(r);
  }
  return Object.values(map).map(d => ({
    nome: d.nome,
    media: Math.round(d.notas.reduce((a,b)=>a+b,0)/d.notas.length*10)/10,
    total: d.notas.length,
    melhor: Math.max(...d.notas),
    rows: d.rows
  })).sort((a,b) => b.media - a.media);
}

function renderRanking(apoios) {
  document.getElementById('cards').innerHTML = apoios.map(a => {
    const c = cls(a.media);
    return `<div class="card ${c}" onclick="goComments('${a.nome.replace(/'/g,"\\'")}')">
      <div class="card-name" title="${a.nome}">${a.nome}</div>
      <div class="score">${a.media.toFixed(1)}<span> /10</span></div>
      <div class="meta">${a.total} avaliação${a.total!==1?'ões':''} · melhor ${a.melhor}</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${a.media*10}%"></div></div>
    </div>`;
  }).join('');

  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
      labels: apoios.map(a => a.nome),
      datasets: [{ data: apoios.map(a => a.media),
        backgroundColor: apoios.map(a => a.media>=8?'#43a047':a.media>=6?'#ffa000':'#e53935'),
        borderRadius: 5 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min:0, max:10, ticks:{stepSize:2}, grid:{color:'#f0f0f0'} },
                x: { ticks:{font:{size:11}}, grid:{display:false} } }
    }
  });
}

function populateFilters() {
  const apoios = [...new Set(all.map(r => r['Apoio']).filter(Boolean))].sort();
  const units  = [...new Set(all.map(r => r['Unidade']).filter(Boolean))].sort();
  const fa = document.getElementById('fa'), fu = document.getElementById('fu');
  apoios.forEach(a => { const o=document.createElement('option');o.value=a;o.textContent=a;fa.appendChild(o); });
  units.forEach(u  => { const o=document.createElement('option');o.value=u;o.textContent=u;fu.appendChild(o); });
}

function goComments(name) {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach((t,i) => t.classList.toggle('active', i===1));
  switchTab('comments', tabs[1]);
  document.getElementById('fa').value = name;
  renderComments();
}

function renderComments() {
  const af = document.getElementById('fa').value;
  const uf = document.getElementById('fu').value;
  const cols = ['Como Avalia','Sugestões','Observações'];
  const rows = all.filter(r =>
    (!af || r['Apoio']===af) &&
    (!uf || r['Unidade']===uf) &&
    cols.some(c => r[c])
  ).sort((a,b) => new Date(b['Timestamp']) - new Date(a['Timestamp']));

  const list = document.getElementById('comments-list');
  if (!rows.length) { list.innerHTML='<div class="nodata">Nenhum comentário encontrado.</div>'; return; }

  list.innerHTML = rows.map(r => {
    const nota = parseFloat(r['Nota'])||0;
    const nc = ncls(nota);
    const parts = [];
    if (r['Como Avalia']) parts.push(`<div class="cm-label">Avaliação</div><div class="cm-text">${r['Como Avalia']}</div>`);
    if (r['Sugestões']) parts.push(`<div class="cm-label">Sugestões</div><div class="cm-text">${r['Sugestões']}</div>`);
    if (r['Observações']) parts.push(`<div class="cm-label">Observações</div><div class="cm-text">${r['Observações']}</div>`);
    return `<div class="comment-card ${nota<7?'bad':''}">
      <div class="cm">
        <span class="cm-apoio">${r['Apoio']}</span>
        <span class="cm-unit">${r['Unidade']}</span>
        <span class="cm-date">${fmtDate(r['Timestamp'])}</span>
        <span class="cm-nota ${nc}">Nota ${nota}</span>
      </div>${parts.join('')}</div>`;
  }).join('');
}

async function init() {
  try {
    const rows = await fetchSheet('Avaliações');
    all = rows.filter(r => r['Apoio']);
    const apoios = aggregate(all);
    const med = all.length ? (all.reduce((s,r)=>s+(parseFloat(r['Nota'])||0),0)/all.length).toFixed(1) : '—';
    document.getElementById('sub').textContent = `NutriSaúde · ${all.length} avaliações · Média geral ${med}`;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('sec-rank').style.display = 'block';
    renderRanking(apoios);
    populateFilters();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div class="err"><b>Erro ao carregar dados.</b><br>${e.message}<br><br>Verifique se a planilha está compartilhada como "Qualquer pessoa com o link pode visualizar".</div>`;
  }
}

init();
</script>
</body>
</html>
